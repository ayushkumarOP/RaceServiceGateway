name: PR Preview Deploy

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request Number"
        required: true

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPO: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
  RACE_SERVICE_URL: ${{ vars.RACE_SERVICE_URL }}
  FORUM_SERVICE_URL: ${{ vars.FORUM_SERVICE_URL }}
  USER_SERVICE_URL: ${{ vars.USER_SERVICE_URL }}

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev

      - name: Build Docker Image
        run: |
          docker build \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE:${GITHUB_SHA} .

      - name: Push Docker Image
        run: |
          docker push \
            $REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE:${GITHUB_SHA}

      - name: Deploy Preview Service
        run: |
          gcloud run deploy ${SERVICE}-pr-${{ github.event.inputs.pr_number }} \
            --project $PROJECT_ID \
            --image $REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE:${GITHUB_SHA} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --service-account $RUNTIME_SERVICE_ACCOUNT \
            --set-env-vars RACE_SERVICE_URL=$RACE_SERVICE_URL,FORUM_SERVICE_URL=$FORUM_SERVICE_URL,USER_SERVICE_URL=$USER_SERVICE_URL

      - name: Get Preview URL
        id: preview-url
        run: |
          URL=$(gcloud run services describe ${SERVICE}-pr-${{ github.event.inputs.pr_number }} \
            --project=$PROJECT_ID \
            --region=$REGION \
            --format='value(status.url)')

          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Health Check
        run: |
          URL=${{ steps.preview-url.outputs.url }}

          echo "Checking health at $URL/health"

          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")

            if [ "$STATUS" = "200" ]; then
              echo "Preview deployment healthy"
              exit 0
            fi

            echo "Waiting for healthy deployment..."
            sleep 10
          done

          echo "Deployment unhealthy"
          exit 1
